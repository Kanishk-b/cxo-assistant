version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cxo_postgres
    restart: always
    environment:
      POSTGRES_USER: cxo_admin
      POSTGRES_PASSWORD: cxo_password
      POSTGRES_DB: cxo_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: