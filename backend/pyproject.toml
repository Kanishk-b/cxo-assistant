[project]
name = "cxo-assistant-backend"
version = "0.1.0"
description = "Backend API and Agent Orchestration"
authors = [
    {name = "Kanishk Bansal"}
]
requires-python = "^3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "langgraph (>=1.1.10,<2.0.0)",
    "langchain-core (>=1.3.3,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "langchain-anthropic (>=1.4.3,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

# This tells Poetry 2.0+ not to look for a downloadable package folder
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"